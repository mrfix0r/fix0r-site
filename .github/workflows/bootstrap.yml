name: Import cleaned site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore and verify repository
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/site.part.* | base64 --decode > /tmp/fix0r-site.tar.xz
          echo "781e6357f634e0968e70c79897e7d70b9bb968eed4d489acfb5910b46ba36d02  /tmp/fix0r-site.tar.xz" | sha256sum -c -
          tar --warning=no-timestamp -xJf /tmp/fix0r-site.tar.xz -C .

          mkdir -p fonts/source
          FONT_BASE="https://raw.githubusercontent.com/ArtifexSoftware/urw-base35-fonts/3c0ba3b5687632dfc66526544a4e811fe0ec0cd9/fonts"
          curl --fail --location --silent --show-error "$FONT_BASE/URWGothic-Book.otf" -o fonts/URWGothic-Book.otf
          curl --fail --location --silent --show-error "$FONT_BASE/URWGothic-Demi.otf" -o fonts/URWGothic-Demi.otf
          curl --fail --location --silent --show-error "$FONT_BASE/URWGothic-Book.afm" -o fonts/source/URWGothic-Book.afm
          curl --fail --location --silent --show-error "$FONT_BASE/URWGothic-Book.t1" -o fonts/source/URWGothic-Book.t1
          curl --fail --location --silent --show-error "$FONT_BASE/URWGothic-Demi.afm" -o fonts/source/URWGothic-Demi.afm
          curl --fail --location --silent --show-error "$FONT_BASE/URWGothic-Demi.t1" -o fonts/source/URWGothic-Demi.t1
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/cbhua/matplotlib-prefab/ba90fda1be2ba37d13ff1c00f0fc9a573b28de15/web/public/generated/fonts/LICENCE-urw-base35.txt" \
            -o fonts/LICENSE.txt

          cat > /tmp/fix0r-fonts.sha256 <<'HASHES'
          04318316cee29950805110c9c8949eea189ef5575132881f4d4d7e03e5299903  fonts/URWGothic-Book.otf
          5b009410cf5231dcb1e45b155c1afedcfc63d82042fd8c414d0dd7705c9fbbae  fonts/URWGothic-Demi.otf
          6372963f2bc62765d9b3827418c434d7aa6617fa14cb3a878e97c8bec11fbfae  fonts/source/URWGothic-Book.afm
          aebc5a18ff50235f0850b3812d86a29d18932c4bb8a097b004b8abafc433a395  fonts/source/URWGothic-Book.t1
          b5f1a65e1505498c144f3d7dac11b0f197f8fd1b812c7f8641af46c40c7771f3  fonts/source/URWGothic-Demi.afm
          83cb6f17a042dea63345e222593be1a1ccb13ded278482d13f6511cad0768c54  fonts/source/URWGothic-Demi.t1
          1315a62758a603a3e6e87a79b8389563789c59c1740b9db8bc2b20e2e2145458  fonts/LICENSE.txt
          HASHES
          sha256sum -c /tmp/fix0r-fonts.sha256

          rm -rf .bootstrap .github/workflows/bootstrap.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          test "$(find . -path './.git' -prune -o -type f -print | wc -l)" -eq 31

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import cleaned Fix0r site source"
          git push
